        const btn = document.getElementById('modal-confirm');
        btn.textContent = confirmLabel;
        btn.className = 'btn ' + (confirmDanger ? 'btn-danger' : 'btn-primary');

        this._onConfirm = onConfirm;
        document.getElementById('modal-overlay').classList.add('active');
        document.getElementById('modal').classList.remove('shake');

        // Focus first input
        requestAnimationFrame(() => {
          const first = document.querySelector('#modal-body input, #modal-body textarea');
          if (first) first.focus();
        });
      },

      hide() {
        document.getElementById('modal-overlay').classList.remove('active');
        this._onConfirm = null;
      },

      shake() {
        const m = document.getElementById('modal');
        m.classList.remove('shake');
        void m.offsetWidth; // reflow to restart animation
        m.classList.add('shake');
      },

      confirm() {
        if (this._onConfirm) this._onConfirm();
      }
    };

    document.getElementById('modal-confirm').addEventListener('click', () => Modal.confirm());
    document.getElementById('modal-overlay').addEventListener('click', e => {

    document.addEventListener('keydown', e => {

              { id: id(), name: 'Reference Doc No',  category: 'why',      dataType: 'VARCHAR', source: 'sap_ecc', description: 'Reference document (XBLNR)',             notes: 'BKPF.XBLNR / ACDOCA.XBLNR', sapTable: 'BKPF', sapField: 'XBLNR', sapMigrationStatus: 'both' },
              { id: id(), name: 'Amount in LC',      category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'Amount in local currency (DMBTR)',       notes: 'BSEG.DMBTR / ACDOCA.DMBTR', sapTable: 'BSEG', sapField: 'DMBTR', sapMigrationStatus: 'both', copaValueField: 'VVB01' },
              { id: id(), name: 'Amount in CC',      category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'Amount in controlling area currency',    notes: 'COEP.WKGBTR / ACDOCA.KSL', sapTable: 'COEP', sapField: 'WKGBTR', sapMigrationStatus: 'changed' },
              { id: id(), name: 'Debit/Credit Ind',  category: 'how_many', dataType: 'VARCHAR', source: 'sap_ecc', description: 'H=Credit S=Debit (SHKZG)',               notes: 'BSEG.SHKZG / ACDOCA.DRCRK', sapTable: 'BSEG', sapField: 'SHKZG', sapMigrationStatus: 'both' },
            ]
          },

          // ── Event 2: CO-PA Profitability Line ─────────────
          {
            id: id(),
            name: 'CO-PA Profitability Line',
            description: 'A profitability line item posted to CO-PA — capturing segment revenue, COGS and overhead for contribution margin analysis. ECC: CE1XXXX (costing-based). S/4: ACDOCA (account-based CO-PA).',
            columns: [
              { id: id(), name: 'Controlling Area',  category: 'where',    dataType: 'VARCHAR', source: 'sap_ecc', description: 'CO-PA operating concern scope',          notes: 'CE1XXXX.KOKRS / ACDOCA.KOKRS', sapTable: 'CE1XXXX', sapField: 'KOKRS', sapMigrationStatus: 'changed' },
              { id: id(), name: 'Profit Centre',     category: 'where',    dataType: 'VARCHAR', source: 'sap_ecc', description: 'CO-PA characteristic: Profit Centre',    notes: 'CE1XXXX.PRCTR / ACDOCA.PRCTR', sapTable: 'CE1XXXX', sapField: 'PRCTR', sapMigrationStatus: 'changed', copaCharacteristic: 'WW002' },
              { id: id(), name: 'Customer',          category: 'who',      dataType: 'VARCHAR', source: 'sap_ecc', description: 'CO-PA characteristic: Customer (KNDNR)', notes: 'CE1XXXX.KNDNR / ACDOCA partner fields', sapTable: 'CE1XXXX', sapField: 'KNDNR', sapMigrationStatus: 'changed', copaCharacteristic: 'WW003' },
              { id: id(), name: 'Material',          category: 'what',     dataType: 'VARCHAR', source: 'sap_ecc', description: 'CO-PA characteristic: Material (ARTNR)', notes: 'CE1XXXX.ARTNR / ACDOCA.MATNR', sapTable: 'CE1XXXX', sapField: 'ARTNR', sapMigrationStatus: 'changed', copaCharacteristic: 'WW004' },
              { id: id(), name: 'Sales Organisation', category: 'where',   dataType: 'VARCHAR', source: 'sap_ecc', description: 'CO-PA characteristic: Sales Org (VKORG)', notes: 'CE1XXXX.VKORG / ACDOCA.VKORG', sapTable: 'CE1XXXX', sapField: 'VKORG', sapMigrationStatus: 'changed', copaCharacteristic: 'WW005' },
              { id: id(), name: 'Billing Date',      category: 'when',     dataType: 'DATE',    source: 'sap_ecc', description: 'Billing / posting date',                  notes: 'CE1XXXX.BUDAT', sapTable: 'CE1XXXX', sapField: 'BUDAT', sapMigrationStatus: 'changed' },
              { id: id(), name: 'Fiscal Year',       category: 'when',     dataType: 'VARCHAR', source: 'sap_ecc', description: 'Fiscal year (GJAHR)',                    notes: '', sapTable: 'CE1XXXX', sapField: 'GJAHR', sapMigrationStatus: 'changed' },
              { id: id(), name: 'Revenue',           category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'CO-PA value field: Revenue (VVB01)',      notes: 'CE1XXXX value field / ACDOCA.KSL', sapTable: 'CE1XXXX', sapField: 'VVB01', sapMigrationStatus: 'ecc_only', copaValueField: 'VVB01' },
              { id: id(), name: 'COGS',              category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'CO-PA value field: Cost of Goods Sold',   notes: 'CE1XXXX value field / ACDOCA.KSL by cost element', sapTable: 'CE1XXXX', sapField: 'VVB02', sapMigrationStatus: 'ecc_only', copaValueField: 'VVB02' },
              { id: id(), name: 'Contribution Margin', category: 'how_many', dataType: 'DECIMAL', source: 'derived', description: 'Revenue minus COGS',                  notes: 'Derived: Revenue - COGS' },
              { id: id(), name: 'ACDOCA Line Item',  category: 'how_many', dataType: 'VARCHAR', source: 'sap_s4',  description: 'S/4 Universal Journal reference (DOCNR)', notes: 'ACDOCA.RLDNR+DOCNR — new in S/4; no ECC equivalent', sapTable: 'ACDOCA', sapField: 'DOCNR', sapMigrationStatus: 's4_only' },
            ]
          },

          // ── Event 3: Cost Centre Allocation ───────────────
          {
            id: id(),
            name: 'Cost Centre Allocation',
            description: 'Periodic CO assessment or distribution cycle allocating costs between cost centres or to CO-PA. ECC: COEP (allocation line items). S/4: ACDOCA.',
            columns: [
              { id: id(), name: 'Sender Cost Centre',   category: 'who',      dataType: 'VARCHAR', source: 'sap_ecc', description: 'Cost centre sending the cost (SKOST)',  notes: 'COEP.SKOST / ACDOCA.SKOST', sapTable: 'COEP', sapField: 'SKOST', sapMigrationStatus: 'both' },
              { id: id(), name: 'Receiver Cost Centre', category: 'where',    dataType: 'VARCHAR', source: 'sap_ecc', description: 'Receiving cost centre (KOSTL)',          notes: 'COEP.KOSTL / ACDOCA.KOSTL', sapTable: 'COEP', sapField: 'KOSTL', sapMigrationStatus: 'both' },
              { id: id(), name: 'Activity Type',        category: 'how',      dataType: 'VARCHAR', source: 'sap_ecc', description: 'Activity type driving allocation (LSTAR)', notes: 'COEP.LSTAR / ACDOCA.LSTAR', sapTable: 'COEP', sapField: 'LSTAR', sapMigrationStatus: 'both' },
              { id: id(), name: 'Cost Element',         category: 'what',     dataType: 'VARCHAR', source: 'sap_ecc', description: 'Secondary cost element for allocation',  notes: 'COEP.KSTAR — in S/4 = ACDOCA.RACCT', sapTable: 'COEP', sapField: 'KSTAR', sapMigrationStatus: 'changed' },
              { id: id(), name: 'Controlling Area',     category: 'where',    dataType: 'VARCHAR', source: 'sap_ecc', description: 'Controlling area scope (KOKRS)',         notes: 'COEP.KOKRS / ACDOCA.KOKRS', sapTable: 'COEP', sapField: 'KOKRS', sapMigrationStatus: 'both' },
              { id: id(), name: 'Fiscal Year',          category: 'when',     dataType: 'VARCHAR', source: 'sap_ecc', description: 'Fiscal year (GJAHR)',                    notes: 'COEP.GJAHR / ACDOCA.GJAHR', sapTable: 'COEP', sapField: 'GJAHR', sapMigrationStatus: 'both' },
              { id: id(), name: 'Posting Period',       category: 'when',     dataType: 'INT',     source: 'sap_ecc', description: 'Posting period (PERIO)',                 notes: 'COEP.PERIO / ACDOCA.POPER', sapTable: 'COEP', sapField: 'PERIO', sapMigrationStatus: 'both' },
              { id: id(), name: 'Allocation Qty',       category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'Quantity of activity allocated',          notes: 'COEP.MENGE', sapTable: 'COEP', sapField: 'MENGE', sapMigrationStatus: 'both' },
              { id: id(), name: 'Allocated Amount LC',  category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'Cost amount in local currency (WKGBTR)', notes: 'COEP.WKGBTR / ACDOCA.DMBTR', sapTable: 'COEP', sapField: 'WKGBTR', sapMigrationStatus: 'changed' },
              { id: id(), name: 'COSS Period Total',    category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'CO period total from COSS table',        notes: 'COSS — retired in S/4; query ACDOCA directly', sapTable: 'COSS', sapField: 'WTGES', sapMigrationStatus: 'ecc_only' },
            ]
          },

          // ── Event 4: CS Service Order Billing ─────────────
          {
            id: id(),
            name: 'CS Service Order Billing',
            description: 'A CS service order is executed and billed to a customer via DP90 resource-related billing. Costs (labour, materials, expenses) are collected on the order, then an SD billing document is created and the order is settled to CO-PA/ACDOCA. Links PM objects (equipment, functional location) with SD billing and CO profitability.',
            columns: [
              // WHO — parties
              { id: id(), name: 'Customer',              category: 'who',      dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Customer being billed for the service (KUNNR)',        notes: 'AUFK/VBPA.KUNNR — Business Partner in S/4', sapTable: 'AUFK', sapField: 'KUNNR', sapMigrationStatus: 'both' },
              { id: id(), name: 'Technician Work Centre', category: 'who',     dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Work centre executing the service (ARBPL)',            notes: 'AUFK.ARBPL — unchanged in S/4', sapTable: 'AUFK', sapField: 'ARBPL', sapMigrationStatus: 'both' },
              // WHAT — PM object + what was done
              { id: id(), name: 'Service Order',         category: 'what',     dataType: 'VARCHAR', source: 'sap_ecc',  description: 'CS service order number (AUFNR)',                       notes: 'AUFK.AUFNR — ACDOCA.AUFNR in S/4 for cost postings', sapTable: 'AUFK', sapField: 'AUFNR', sapMigrationStatus: 'both' },
              { id: id(), name: 'Order Type',            category: 'what',     dataType: 'VARCHAR', source: 'sap_ecc',  description: 'CS order type: SM01=Repair, SM02=Warranty, SM03=Install', notes: 'AUFK.AUART', sapTable: 'AUFK', sapField: 'AUART', sapMigrationStatus: 'both' },
              { id: id(), name: 'Equipment',             category: 'what',     dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Equipment item serviced (EQUNR)',                       notes: 'AUFK.EQUNR / EQUI — unchanged in S/4', sapTable: 'AUFK', sapField: 'EQUNR', sapMigrationStatus: 'both' },
              { id: id(), name: 'Service Notification',  category: 'what',     dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Source CS/PM notification that triggered the order',    notes: 'VIQMEL.QMNUM', sapTable: 'VIQMEL', sapField: 'QMNUM', sapMigrationStatus: 'both' },
              // WHEN — timeline
              { id: id(), name: 'Order Creation Date',   category: 'when',     dataType: 'DATE',    source: 'sap_ecc',  description: 'Date the service order was created (AUFK.ERDAT)',       notes: 'AUFK.ERDAT', sapTable: 'AUFK', sapField: 'ERDAT', sapMigrationStatus: 'both' },
              { id: id(), name: 'Actual Completion Date', category: 'when',    dataType: 'DATE',    source: 'sap_ecc',  description: 'Actual completion date (AUFK.IDAT2)',                   notes: 'AUFK.IDAT2 — unchanged', sapTable: 'AUFK', sapField: 'IDAT2', sapMigrationStatus: 'both' },
              { id: id(), name: 'Billing Date',          category: 'when',     dataType: 'DATE',    source: 'sap_ecc',  description: 'Date of SD billing document (VBRK.FKDAT)',              notes: 'VBRK.FKDAT / ACDOCA.BUDAT at billing posting', sapTable: 'VBRK', sapField: 'FKDAT', sapMigrationStatus: 'both' },
              { id: id(), name: 'Fiscal Period',         category: 'when',     dataType: 'VARCHAR', source: 'derived',  description: 'Fiscal period of revenue recognition',                  notes: 'Derived from Billing Date via fiscal calendar' },
              // WHERE — PM location + CO org
              { id: id(), name: 'Functional Location',   category: 'where',    dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Physical location where service was performed (TPLNR)', notes: 'IFLOT.TPLNR — unchanged in S/4', sapTable: 'IFLOT', sapField: 'TPLNR', sapMigrationStatus: 'both' },
              { id: id(), name: 'Profit Centre',         category: 'where',    dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Profit centre for revenue & cost recognition (PRCTR)',  notes: 'AUFK.PRCTR / ACDOCA.PRCTR', sapTable: 'AUFK', sapField: 'PRCTR', sapMigrationStatus: 'both', copaCharacteristic: 'WW002' },
              { id: id(), name: 'Company Code',          category: 'where',    dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Legal entity (BUKRS)',                                  notes: 'AUFK.BUKRS / ACDOCA.RBUKRS', sapTable: 'AUFK', sapField: 'BUKRS', sapMigrationStatus: 'both' },
              // HOW — billing method
              { id: id(), name: 'Billing Type',          category: 'how',      dataType: 'VARCHAR', source: 'sap_ecc',  description: 'DP90=Resource-Related | Fixed Price | Warranty | Manual', notes: 'Determined by CS billing indicator on order', sapTable: 'AUFK', sapField: 'FKART', sapMigrationStatus: 'both' },
              { id: id(), name: 'SD Billing Document',   category: 'how',      dataType: 'VARCHAR', source: 'sap_ecc',  description: 'SD billing document (VBELN) created via DP90',          notes: 'VBRK.VBELN — links service order to SD billing', sapTable: 'VBRK', sapField: 'VBELN', sapMigrationStatus: 'both' },
              { id: id(), name: 'Service Contract',      category: 'how',      dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Covering service contract (VBELN) if applicable',        notes: 'SD outline agreement for contracted service', sapTable: 'VBAK', sapField: 'VBELN', sapMigrationStatus: 'both' },
              // WHY — reason for service
              { id: id(), name: 'SLA Priority',          category: 'why',      dataType: 'VARCHAR', source: 'sap_ecc',  description: 'Service priority: Emergency | High | Medium | Low',      notes: 'AUFK.PRIOK', sapTable: 'AUFK', sapField: 'PRIOK', sapMigrationStatus: 'both' },
              { id: id(), name: 'Is Warranty',           category: 'why',      dataType: 'BOOLEAN', source: 'sap_ecc',  description: 'True if service is covered under manufacturer warranty',  notes: 'Derived from order type or warranty master' },
              // HOW MANY — financials
              { id: id(), name: 'Labour Cost',           category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc',  description: 'Actual labour cost posted to order',                     notes: 'COEP.WKGBTR by cost element / ACDOCA.KSL in S/4', sapTable: 'COEP', sapField: 'WKGBTR', sapMigrationStatus: 'changed', copaValueField: 'VVB10' },
              { id: id(), name: 'Materials Cost',        category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc',  description: 'Goods issue cost for spare parts / materials',           notes: 'COEP.WKGBTR by material cost element / ACDOCA', sapTable: 'COEP', sapField: 'WKGBTR', sapMigrationStatus: 'changed', copaValueField: 'VVB11' },
              { id: id(), name: 'External Services Cost', category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc', description: 'Cost of externally procured services (subcontracting)',   notes: 'COEP.WKGBTR by external cost element', sapTable: 'COEP', sapField: 'WKGBTR', sapMigrationStatus: 'changed' },
              { id: id(), name: 'Total Order Cost',      category: 'how_many', dataType: 'DECIMAL', source: 'derived',  description: 'Labour + Materials + External Services',                 notes: 'Derived: sum of cost components' },
              { id: id(), name: 'Billed Revenue',        category: 'how_many', dataType: 'DECIMAL', source: 'sap_ecc',  description: 'Amount invoiced to customer on SD billing document',     notes: 'VBRP.NETWR / ACDOCA.KSL at revenue posting', sapTable: 'VBRP', sapField: 'NETWR', sapMigrationStatus: 'both', copaValueField: 'VVB01' },
              { id: id(), name: 'Service Margin',        category: 'how_many', dataType: 'DECIMAL', source: 'derived',  description: 'Billed Revenue minus Total Order Cost',                  notes: 'Derived: Billed Revenue - Total Order Cost' },
              { id: id(), name: 'Response Time Actual', category: 'how_many',  dataType: 'DECIMAL', source: 'derived',  description: 'Actual hours from notification to order release',        notes: 'Derived: Order Creation Date - Notification Date' },
            ]
          }
        ]
      };

      Storage.saveProject(project);
      const migrated = Storage.load().projects.find(p => p.id === project.id);
      if (migrated) {
        migrated.events.forEach(e => {
          e.grain = 'fiscal_period';
        });
        Storage.saveProject(migrated);
      }
      showToast('SAP FI/CO example project loaded.');
      Router.navigate(`project/${project.id}`);
    }

    // ─── Utility ───────────────────────────────────────────
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── Boot ──────────────────────────────────────────────
    Router.init();
  </script>
</body>
</html>

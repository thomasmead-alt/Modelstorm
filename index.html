  <script src="js/diagram.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/matrix.js"></script>

  <script>
    // ─── Global constants: column origin (source) ─────────
    const SOURCES = {
      source_system: {
        label: 'Source System',
        description: 'This attribute exists in the operational / transactional source as-is. No transformation logic is required beyond loading it.',
        formatHint: 'Populate "Format / Examples" with real values from the source to drive sample data generation.',
        color: '#166534',
        bg: '#dcfce7'
      },
      derived: {
        label: 'Derived',
        description: 'This attribute does not exist in the source. It will be calculated, aggregated or enriched in the data transformation layer (ETL/ELT).',
        formatHint: 'Document the derivation rule in the Description field. Populate "Format / Examples" with a realistic output range.',
        color: '#9a3412',
        bg: '#fff7ed'
      },
      lookup: {
        label: 'Lookup',
        description: 'This attribute is not in the source directly — it is populated by joining to a reference / mapping table during transformation (e.g. fiscal calendar, territory mapping, product hierarchy).',
        formatHint: 'Name the reference table and key in the Description. Populate "Format / Examples" with typical lookup values.',
        color: '#1e40af',
        bg: '#eff6ff'
      }
    };

    // ─── Global constants: 7W categories ──────────────────
    const CATEGORIES = {
      who: {
        label: 'Who',
        meaning: 'People or organisations',
        example: 'Customer, Employee, Supplier',
        outcome: 'Becomes a dimension table',
        color: '#3b82f6'
      },
      what: {
        label: 'What',
        meaning: 'Products, services or items',
        example: 'Product, SKU, Service',
        outcome: 'Becomes a dimension table',
        color: '#10b981'
      },
      when: {
        label: 'When',
        meaning: 'Time the event occurred',
        example: 'Sale Date, Order Time',
        outcome: 'Becomes a Date/Time dimension',
        color: '#8b5cf6'
      },
      where: {
        label: 'Where',
        meaning: 'Location of the event',
        example: 'Store, Region, Channel',
        outcome: 'Becomes a Location dimension',
        color: '#f59e0b'
      },
      how: {
        label: 'How',
        meaning: 'Method or channel used',
        example: 'Payment Method, Delivery Type',
        outcome: 'Becomes a Method dimension',
        color: '#14b8a6'
      },
      why: {
        label: 'Why',
        meaning: 'Reason or motivation',
        example: 'Campaign, Promotion, Reason Code',
        outcome: 'Becomes a Reason dimension',
        color: '#ec4899'
      },
      how_many: {
        label: 'How many',
        meaning: 'Measurable quantities or amounts',
        example: 'Quantity Sold, Revenue, Count',
        outcome: 'Becomes a fact (measure) in the fact table',
        color: '#ef4444'
      }
    };

    // ─── Modal helper ──────────────────────────────────────
    const Modal = {
      _onConfirm: null,

      show({ title, body, confirmLabel = 'Confirm', confirmDanger = false, onConfirm }) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = body;

        const btn = document.getElementById('modal-confirm');
        btn.textContent = confirmLabel;
        btn.className = 'btn ' + (confirmDanger ? 'btn-danger' : 'btn-primary');

        this._onConfirm = onConfirm;
        document.getElementById('modal-overlay').classList.add('active');
        document.getElementById('modal').classList.remove('shake');

        // Focus first input
        requestAnimationFrame(() => {
          const first = document.querySelector('#modal-body input, #modal-body textarea');
          if (first) first.focus();
        });
      },

      hide() {
        document.getElementById('modal-overlay').classList.remove('active');
        this._onConfirm = null;
      },

      shake() {
        const m = document.getElementById('modal');
        m.classList.remove('shake');
        void m.offsetWidth; // reflow to restart animation
        m.classList.add('shake');
      },

      confirm() {
        if (this._onConfirm) this._onConfirm();
      }
    };

    document.getElementById('modal-confirm').addEventListener('click', () => Modal.confirm());
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) Modal.hide();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') Modal.hide();
      if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('active')) {
        // Enter in modal inputs — let form handle naturally; only trigger confirm from explicit button
      }
    });

    // ─── Toast helper ──────────────────────────────────────
    function showToast(message, duration = 2500) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 300ms';
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    // ─── Sidebar toggle ────────────────────────────────────
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      document.body.classList.toggle('sidebar-collapsed');
    });

    // ─── Router setup ──────────────────────────────────────
    Router.register('projects', () => Projects.renderList());
    Router.register('project/:id', ({ id }) => Projects.renderProject(id));
    Router.register('event/:id', ({ id }) => Matrix.renderEvent(id));
    Router.register('diagram/:id', ({ id }) => {
      const found = Storage.getEvent(id);
      if (found) Diagram.render(found.event);
      else Router.navigate('projects');
    });
    Router.register('datagen/:id', ({ id }) => {
      const found = Storage.getEvent(id);
      if (found) DataGen.render(found.event, found.project);
      else Router.navigate('projects');
    });
    Router.register('recents', () => renderRecents());
    Router.register('guide', () => renderGuide());
    Router.register('settings', () => renderSettings());

    // ─── Recents view ──────────────────────────────────────
    function renderRecents() {
      const data = Storage.load();
      const allEvents = [];
      data.projects.forEach(p => p.events.forEach(e => allEvents.push({ event: e, project: p })));

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="view-header">
          <div>
            <h1 class="view-title">Recent Events</h1>
            <p class="view-subtitle">All business events across all projects</p>
          </div>
        </div>
        ${allEvents.length === 0
          ? `<div class="empty-state" style="max-width:500px">
               <h2 class="empty-title">No events yet</h2>
               <p class="empty-desc">Create a project and add business events to see them here.</p>
               <a href="#projects" class="btn btn-primary">Go to Projects</a>
             </div>`
          : `<div class="card-grid">
               ${allEvents.map(({ event, project }) => `
                 <div class="card event-card" onclick="Router.navigate('event/${event.id}')">
                   <div class="card-body">
                     <div style="font-size:11px;color:var(--text-subtle);margin-bottom:4px">${esc(project.name)}</div>
                     <h3 class="card-title">${esc(event.name)}</h3>
                     ${event.description ? `<p class="card-desc">${esc(event.description)}</p>` : ''}
                     <div class="card-meta"><span>${event.columns.length} columns</span></div>
                   </div>
                   <div class="card-actions" onclick="event.stopPropagation()">
                     <button class="btn btn-ghost btn-sm" onclick="Router.navigate('event/${event.id}')">Edit</button>
                     <button class="btn btn-ghost btn-sm" onclick="Router.navigate('diagram/${event.id}')">Diagram</button>
                   </div>
                 </div>
               `).join('')}
             </div>`
        }
      `;
    }

    // ─── Guide view ────────────────────────────────────────
    function renderGuide() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="view-header">
          <div>
            <h1 class="view-title">BEAM Methodology Guide</h1>
            <p class="view-subtitle">Business Event Analysis &amp; Modelling — by Lawrence Corr</p>
          </div>
        </div>

        <div class="guide-content" style="max-width:760px">
          <div class="info-banner">
            <strong>What is BEAM?</strong> BEAM (Business Event Analysis &amp; Modelling) is an agile
            approach to data warehouse design from Lawrence Corr's book
            <em>"Agile Data Warehouse Design"</em>. It uses storytelling — asking who, what, when,
            where, how, why and how many — to collaboratively discover and model business events,
            then derives dimensional star schemas directly from those stories.
          </div>

          <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">The BEAM Process</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px">
            ${[
              ['1. Identify events', 'Discover the key things that <em>happen</em> in your business domain. Use nouns: Sale, Shipment, Login, Enrolment, Claim.'],
              ['2. Tell the event story', 'For each event, answer the 7 Ws. Write them as a sentence: <em>"A <strong>Customer</strong> (Who) buys a <strong>Product</strong> (What) on a <strong>Date</strong> (When) at a <strong>Store</strong> (Where) for a <strong>Price</strong> (How many)."</em>'],
              ['3. Build the BEAM matrix', 'Translate each 7W answer into a row in the matrix table. Assign a category, data type and description.'],
              ['4. Derive the star schema', 'Non-measure categories (Who, What, When, Where, How, Why) become <em>dimension tables</em>. Measures (How many) go into the central <em>fact table</em>, along with foreign keys to each dimension.'],
            ].map(([title, body]) => `
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px">
                <div style="font-weight:600;margin-bottom:6px;color:var(--primary)">${title}</div>
                <div style="font-size:13px;color:var(--text-muted);line-height:1.6">${body}</div>
              </div>
            `).join('')}
          </div>

          <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">The 7 Ws in Detail</h2>
          <div class="ref-grid" style="margin-bottom:28px">
            ${Object.entries(CATEGORIES).map(([key, cat]) => `
              <div class="ref-card">
                <div class="ref-badge" style="background:${cat.color}">${cat.label}</div>
                <div class="ref-meaning"><strong>${cat.meaning}</strong></div>
                <div class="ref-example" style="margin:4px 0">e.g. <em>${cat.example}</em></div>
                <div class="ref-outcome">${cat.outcome}</div>
              </div>
            `).join('')}
          </div>

          <h2 style="font-size:16px;font-weight:700;margin-bottom:12px">Star Schema Output</h2>
          <div class="info-banner" style="border-left-color:var(--primary);background:#fff7ed;color:#92400e">
            <strong>Fact table</strong> — named after the event (e.g. <em>Sale Fact</em>). Contains all
            <strong>How many</strong> measures plus a surrogate key and foreign keys linking to each dimension.<br><br>
            <strong>Dimension tables</strong> — one per non-measure 7W category (e.g. <em>Customer Dim</em>,
            <em>Product Dim</em>, <em>Date Dim</em>). Each holds descriptive attributes and a surrogate primary key.<br><br>
            Use the <strong>View Diagram</strong> button on any event to see the auto-generated star schema.
          </div>

          <div style="margin-top:24px">
            <a href="#projects" class="btn btn-primary">Start modelling →</a>
          </div>
        </div>
      `;
    }

    // ─── Settings view ─────────────────────────────────────
    function renderSettings() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="view-header">
          <div>
            <h1 class="view-title">Settings</h1>
          </div>
        </div>
        <div style="max-width:480px">
          <div class="export-section">
            <h3>Data Management</h3>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px">
              All data is stored in your browser's localStorage. Nothing is sent to a server.
            </p>
            <div class="export-actions">
              <button class="btn btn-ghost btn-sm" onclick="settingsExportAll()">⬇ Export all data (JSON)</button>
              <button class="btn btn-danger btn-sm" onclick="settingsClearAll()">✕ Clear all data</button>
            </div>
          </div>

          <div class="export-section" style="margin-top:12px">
            <h3>About</h3>
            <p style="font-size:13px;color:var(--text-muted);line-height:1.7">
              <strong>Modelstorm</strong> is a browser-based BEAM data modelling tool based on the
              methodology from <em>Agile Data Warehouse Design</em> by Lawrence Corr.<br><br>
              No account, no backend, no tracking. Your data stays in your browser.
            </p>
          </div>
        </div>
      `;
    }

    function settingsExportAll() {
      const data = Storage.load();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'modelstorm-backup.json'; a.click();
      URL.revokeObjectURL(url);
    }

    function settingsClearAll() {
      Modal.show({
        title: 'Clear all data',
        body: '<p>This will permanently delete <strong>all projects and events</strong>. This cannot be undone.</p>',
        confirmLabel: 'Clear everything',
        confirmDanger: true,
        onConfirm() {
          localStorage.removeItem('beam_app');
          Modal.hide();
          showToast('All data cleared.');
          Router.navigate('projects');
        }
      });
    }

    // ─── Load example project ─────────────────────────────
    function loadExample() {
      const existing = Storage.load().projects.find(p => p.name === 'Financial Margin Reporting');
      if (existing) { Router.navigate(`project/${existing.id}`); return; }

      const id = () => Storage.generateId();

      const project = {
        id: id(),
        name: 'Financial Margin Reporting',
        description: 'Data warehouse model for analysing product sales profitability and gross margin by customer, product, region and channel. Based on the BEAM methodology.',
        createdAt: new Date().toISOString(),
        events: [

          // ── Event 1: Product Sale ──────────────────────────
          {
            id: id(),
            name: 'Product Sale',
            description: 'A product or service is sold to a customer, generating revenue against which cost of goods is measured to derive gross margin.',
            columns: [
              // WHO
              { id: id(), name: 'Customer',         category: 'who',      dataType: 'VARCHAR', source: 'source_system', description: 'The buying customer or account',                        notes: 'From CRM / order management system' },
              { id: id(), name: 'Account Manager',  category: 'who',      dataType: 'VARCHAR', source: 'source_system', description: 'Internal sales owner responsible for the account',      notes: 'From HR / CRM system' },
              // WHAT
              { id: id(), name: 'Product',          category: 'what',     dataType: 'VARCHAR', source: 'source_system', description: 'The product or SKU sold',                               notes: 'From product catalogue / ERP' },
              { id: id(), name: 'Product Category', category: 'what',     dataType: 'VARCHAR', source: 'source_system', description: 'Product line or category grouping',                     notes: 'e.g. Hardware, Software, Services' },
              // WHEN
              { id: id(), name: 'Invoice Date',     category: 'when',     dataType: 'DATE',    source: 'source_system', description: 'Date the invoice was raised',                           notes: 'From billing system' },
              { id: id(), name: 'Fiscal Period',    category: 'when',     dataType: 'VARCHAR', source: 'derived',       description: 'Fiscal month-year for reporting alignment',              notes: 'Derived from Invoice Date via fiscal calendar lookup — e.g. FY25-Q1' },
              // WHERE
              { id: id(), name: 'Sales Region',     category: 'where',    dataType: 'VARCHAR', source: 'source_system', description: 'Geographic sales region',                               notes: 'e.g. EMEA, APAC, Americas — from CRM territory data' },
              { id: id(), name: 'Business Unit',    category: 'where',    dataType: 'VARCHAR', source: 'source_system', description: 'Internal business unit responsible for the sale',       notes: 'From org hierarchy / ERP' },
              // HOW
              { id: id(), name: 'Sales Channel',    category: 'how',      dataType: 'VARCHAR', source: 'source_system', description: 'Route to market for the sale',                         notes: 'Direct, Partner, Online, Reseller' },
              { id: id(), name: 'Contract Type',    category: 'how',      dataType: 'VARCHAR', source: 'source_system', description: 'Commercial structure of the sale',                     notes: 'Subscription, One-Time, Licence, Professional Services' },
              // WHY
              { id: id(), name: 'Discount Reason',  category: 'why',      dataType: 'VARCHAR', source: 'source_system', description: 'Reason a discount was applied, if any',                notes: 'Competitive, Volume, Strategic, Partner; blank if no discount' },
              { id: id(), name: 'Deal Type',        category: 'why',      dataType: 'VARCHAR', source: 'source_system', description: 'Classification of the commercial motion',              notes: 'New Business, Renewal, Expansion, Upsell' },
              // HOW MANY
              { id: id(), name: 'List Price',       category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Undiscounted published price',                         notes: 'Currency: local; from price book' },
              { id: id(), name: 'Discount Amount',  category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Value of discount applied',                            notes: 'Can be zero' },
              { id: id(), name: 'Net Revenue',      category: 'how_many', dataType: 'DECIMAL', source: 'derived',       description: 'Revenue after discounts (List Price − Discount Amount)', notes: 'Calculated in data layer' },
              { id: id(), name: 'COGS',             category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Cost of Goods Sold — direct cost of the product/service delivered', notes: 'From finance / ERP cost ledger' },
              { id: id(), name: 'Gross Margin',     category: 'how_many', dataType: 'DECIMAL', source: 'derived',       description: 'Net Revenue minus COGS',                               notes: 'Calculated in data layer: Net Revenue − COGS' },
              { id: id(), name: 'Gross Margin %',   category: 'how_many', dataType: 'DECIMAL', source: 'derived',       description: 'Gross Margin as a percentage of Net Revenue',          notes: 'Calculated: Gross Margin / Net Revenue × 100; null-safe' },
              { id: id(), name: 'Units Sold',       category: 'how_many', dataType: 'INT',     source: 'source_system', description: 'Number of units or licences sold',                     notes: 'From order line items' },
            ]

          // ── Event 2: Cost Allocation ───────────────────────
          {
            id: id(),
            name: 'Cost Allocation',
            description: 'Periodic allocation of overhead and indirect costs to products and business units, enabling contribution margin analysis beyond direct gross margin.',
            columns: [
              // WHO
              { id: id(), name: 'Cost Centre Owner', category: 'who',     dataType: 'VARCHAR', source: 'source_system', description: 'Person or team responsible for the cost centre',       notes: 'From HR / finance system' },
              // WHAT
              { id: id(), name: 'Cost Category',    category: 'what',     dataType: 'VARCHAR', source: 'source_system', description: 'Type of cost being allocated',                         notes: 'e.g. Headcount, Infrastructure, Marketing, R&D' },
              { id: id(), name: 'Product',          category: 'what',     dataType: 'VARCHAR', source: 'source_system', description: 'Product or service the cost is allocated to',          notes: 'Matches Product dimension from Product Sale event' },

              { id: id(), name: 'Fiscal Period',    category: 'when',     dataType: 'VARCHAR', source: 'derived',       description: 'Fiscal month-year the cost falls within',               notes: 'Derived from Allocation Date; aligns with Product Sale fiscal calendar' },

              // HOW
              { id: id(), name: 'Allocation Method', category: 'how',     dataType: 'VARCHAR', source: 'source_system', description: 'Methodology used to spread the cost',                  notes: 'Revenue%, Headcount%, Equal Split, Direct Charge' },

              { id: id(), name: 'Variance Type',    category: 'why',      dataType: 'VARCHAR', source: 'derived',       description: 'Whether this allocation is Budget, Forecast or Actual', notes: 'Derived from source dataset tag; used for Budget vs Actual reporting' },
              // HOW MANY
              { id: id(), name: 'Allocated Amount', category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Cost amount allocated in this entry',                  notes: 'From finance general ledger' },
              { id: id(), name: 'Contribution Margin', category: 'how_many', dataType: 'DECIMAL', source: 'derived',    description: 'Net Revenue minus COGS minus Allocated Overhead',      notes: 'Calculated in data layer by joining to Product Sale fact' },
              { id: id(), name: 'Contribution Margin %', category: 'how_many', dataType: 'DECIMAL', source: 'derived',  description: 'Contribution Margin as a percentage of Net Revenue',   notes: 'Calculated: Contribution Margin / Net Revenue × 100' },
            ]
          }
        ]
      };

      Storage.saveProject(project);
      showToast('Example project loaded.');
      Router.navigate(`project/${project.id}`);
    }

    // ─── Utility ───────────────────────────────────────────
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── Boot ──────────────────────────────────────────────
    Router.init();
  </script>
</body>
</html>

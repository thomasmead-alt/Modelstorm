    // ─── Modal helper ──────────────────────────────────────
    const Modal = {
      _onConfirm: null,

      show({ title, body, confirmLabel = 'Confirm', confirmDanger = false, onConfirm }) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = body;

        const btn = document.getElementById('modal-confirm');
        btn.textContent = confirmLabel;
        btn.className = 'btn ' + (confirmDanger ? 'btn-danger' : 'btn-primary');

        this._onConfirm = onConfirm;
        document.getElementById('modal-overlay').classList.add('active');
        document.getElementById('modal').classList.remove('shake');

        // Focus first input
        requestAnimationFrame(() => {
          const first = document.querySelector('#modal-body input, #modal-body textarea');
          if (first) first.focus();
        });
      },

      hide() {
        document.getElementById('modal-overlay').classList.remove('active');
        this._onConfirm = null;
      },

      shake() {
        const m = document.getElementById('modal');
        m.classList.remove('shake');
        void m.offsetWidth; // reflow to restart animation
        m.classList.add('shake');
      },

      confirm() {
        if (this._onConfirm) this._onConfirm();
      }
    };

    document.getElementById('modal-confirm').addEventListener('click', () => Modal.confirm());
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) Modal.hide();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') Modal.hide();
      if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('active')) {
        // Enter in modal inputs — let form handle naturally; only trigger confirm from explicit button
      }
    });

              // WHEN
              { id: id(), name: 'Invoice Date',     category: 'when',     dataType: 'DATE',    source: 'source_system', description: 'Date the invoice was raised',                           notes: 'From billing system' },
              { id: id(), name: 'Fiscal Period',    category: 'when',     dataType: 'VARCHAR', source: 'derived',       description: 'Fiscal month-year for reporting alignment',              notes: 'Derived from Invoice Date via fiscal calendar lookup — e.g. FY25-Q1' },
              // WHERE
              { id: id(), name: 'Sales Region',     category: 'where',    dataType: 'VARCHAR', source: 'source_system', description: 'Geographic sales region',                               notes: 'e.g. EMEA, APAC, Americas — from CRM territory data' },
              { id: id(), name: 'Business Unit',    category: 'where',    dataType: 'VARCHAR', source: 'source_system', description: 'Internal business unit responsible for the sale',       notes: 'From org hierarchy / ERP' },
              // HOW
              { id: id(), name: 'Sales Channel',    category: 'how',      dataType: 'VARCHAR', source: 'source_system', description: 'Route to market for the sale',                         notes: 'Direct, Partner, Online, Reseller' },
              { id: id(), name: 'Contract Type',    category: 'how',      dataType: 'VARCHAR', source: 'source_system', description: 'Commercial structure of the sale',                     notes: 'Subscription, One-Time, Licence, Professional Services' },
              // WHY
              { id: id(), name: 'Discount Reason',  category: 'why',      dataType: 'VARCHAR', source: 'source_system', description: 'Reason a discount was applied, if any',                notes: 'Competitive, Volume, Strategic, Partner; blank if no discount' },
              { id: id(), name: 'Deal Type',        category: 'why',      dataType: 'VARCHAR', source: 'source_system', description: 'Classification of the commercial motion',              notes: 'New Business, Renewal, Expansion, Upsell' },
              // HOW MANY
              { id: id(), name: 'List Price',       category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Undiscounted published price',                         notes: 'Currency: local; from price book' },
              { id: id(), name: 'Discount Amount',  category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Value of discount applied',                            notes: 'Can be zero' },
              { id: id(), name: 'Net Revenue',      category: 'how_many', dataType: 'DECIMAL', source: 'derived',       description: 'Revenue after discounts (List Price − Discount Amount)', notes: 'Calculated in data layer' },
              { id: id(), name: 'COGS',             category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Cost of Goods Sold — direct cost of the product/service delivered', notes: 'From finance / ERP cost ledger' },
              { id: id(), name: 'Gross Margin',     category: 'how_many', dataType: 'DECIMAL', source: 'derived',       description: 'Net Revenue minus COGS',                               notes: 'Calculated in data layer: Net Revenue − COGS' },
              { id: id(), name: 'Gross Margin %',   category: 'how_many', dataType: 'DECIMAL', source: 'derived',       description: 'Gross Margin as a percentage of Net Revenue',          notes: 'Calculated: Gross Margin / Net Revenue × 100; null-safe' },
              { id: id(), name: 'Units Sold',       category: 'how_many', dataType: 'INT',     source: 'source_system', description: 'Number of units or licences sold',                     notes: 'From order line items' },
            ]
          },

          // ── Event 2: Cost Allocation ───────────────────────
          {
            id: id(),
            name: 'Cost Allocation',
            description: 'Periodic allocation of overhead and indirect costs to products and business units, enabling contribution margin analysis beyond direct gross margin.',
            columns: [
              // WHO
              { id: id(), name: 'Cost Centre Owner', category: 'who',     dataType: 'VARCHAR', source: 'source_system', description: 'Person or team responsible for the cost centre',       notes: 'From HR / finance system' },
              // WHAT
              { id: id(), name: 'Cost Category',    category: 'what',     dataType: 'VARCHAR', source: 'source_system', description: 'Type of cost being allocated',                         notes: 'e.g. Headcount, Infrastructure, Marketing, R&D' },
              { id: id(), name: 'Product',          category: 'what',     dataType: 'VARCHAR', source: 'source_system', description: 'Product or service the cost is allocated to',          notes: 'Matches Product dimension from Product Sale event' },
              // WHEN
              { id: id(), name: 'Allocation Date',  category: 'when',     dataType: 'DATE',    source: 'source_system', description: 'Date the allocation was posted',                       notes: 'From finance journal entries' },
              { id: id(), name: 'Fiscal Period',    category: 'when',     dataType: 'VARCHAR', source: 'derived',       description: 'Fiscal month-year the cost falls within',               notes: 'Derived from Allocation Date; aligns with Product Sale fiscal calendar' },
              // WHERE
              { id: id(), name: 'Business Unit',    category: 'where',    dataType: 'VARCHAR', source: 'source_system', description: 'Business unit absorbing the cost',                     notes: 'From org hierarchy; matches Product Sale Business Unit dimension' },
              { id: id(), name: 'Region',           category: 'where',    dataType: 'VARCHAR', source: 'source_system', description: 'Geographic region for regional P&L views',             notes: '' },
              // HOW
              { id: id(), name: 'Allocation Method', category: 'how',     dataType: 'VARCHAR', source: 'source_system', description: 'Methodology used to spread the cost',                  notes: 'Revenue%, Headcount%, Equal Split, Direct Charge' },
              // WHY
              { id: id(), name: 'Variance Type',    category: 'why',      dataType: 'VARCHAR', source: 'derived',       description: 'Whether this allocation is Budget, Forecast or Actual', notes: 'Derived from source dataset tag; used for Budget vs Actual reporting' },
              // HOW MANY
              { id: id(), name: 'Allocated Amount', category: 'how_many', dataType: 'DECIMAL', source: 'source_system', description: 'Cost amount allocated in this entry',                  notes: 'From finance general ledger' },
              { id: id(), name: 'Contribution Margin', category: 'how_many', dataType: 'DECIMAL', source: 'derived',    description: 'Net Revenue minus COGS minus Allocated Overhead',      notes: 'Calculated in data layer by joining to Product Sale fact' },
              { id: id(), name: 'Contribution Margin %', category: 'how_many', dataType: 'DECIMAL', source: 'derived',  description: 'Contribution Margin as a percentage of Net Revenue',   notes: 'Calculated: Contribution Margin / Net Revenue × 100' },
            ]
          }
        ]
      };

      // Save to storage first so migration can apply all Phase 3 field defaults
      Storage.saveProject(project);
      // Reload to get migrated version with all defaults applied
      const migrated = Storage.load().projects.find(p => p.id === project.id);
      // Also set additivity for known non-additive/semi-additive measures
      if (migrated) {
        migrated.events.forEach(e => {
          e.grain = e.name === 'Cost Allocation' ? 'monthly' : 'transaction';
          e.columns.forEach(col => {
            if (col.name.includes('%')) { col.additiveType = 'non_additive'; }
            else if (['Gross Margin', 'Contribution Margin', 'Net Revenue'].includes(col.name) && col.source === 'derived') { col.additiveType = 'fully_additive'; col.formula = col.name === 'Net Revenue' ? '= List Price - Discount Amount' : col.name === 'Gross Margin' ? '= Net Revenue - COGS' : '= Net Revenue - COGS - Allocated Amount'; }
            if (col.name.includes('%')) { col.plLineId = col.name.includes('Gross') ? 'gross_margin' : ''; }
            if (col.name === 'Net Revenue') col.plLineId = 'rev_net';
            if (col.name === 'COGS') col.plLineId = 'cos_materials';
            if (col.name === 'Gross Margin' && e.name === 'Product Sale') col.plLineId = 'gross_margin';
            if (col.name === 'Discount Amount') col.plLineId = 'rev_discount';
            if (col.name === 'List Price') col.plLineId = 'rev_gross';
            if (col.name === 'Allocated Amount') col.plLineId = 'opex_ga';
          });
        });
        Storage.saveProject(migrated);
      }
      showToast('Example project loaded.');
      Router.navigate(`project/${project.id}`);
    }

    // ─── Utility ───────────────────────────────────────────
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── Boot ──────────────────────────────────────────────
    Router.init();
  </script>
</body>
</html>
